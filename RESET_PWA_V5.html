<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075f3a"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Reset CFL PWA</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#075f3a;color:#fff;font-family:Segoe UI,Arial;text-align:center;padding:20px}.c{max-width:460px}.sp{width:38px;height:38px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;margin:18px auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div class="c"><h2>पुराना CFL PWA cache हटाया जा रहा है…</h2><div class="sp"></div><p>Reset पूरा होते ही latest app खुलेगा।</p></div>
<script>(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()));}if('caches' in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>/cfl[-_ ]?(pwa|daily)/i.test(k)).map(k=>caches.delete(k)));}localStorage.removeItem('CFL_PWA_MIGRATED_TO_V5');sessionStorage.clear();}catch(e){}setTimeout(()=>location.replace('./launch-v5.html?reset=1&ts='+Date.now()),650);})();</script></body></html>

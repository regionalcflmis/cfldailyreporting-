<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#086b45">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CFL Daily">
  <title>CFL Daily Data Input</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./assets/app.css?v=3">
</head>
<body>
  <main id="appRoot">
    <section id="splash" class="splash" aria-live="polite">
      <img src="./assets/icons/icon-192.png" alt="CFL" class="logo">
      <div class="title">CFL Daily Data Input</div>
      <div class="subtitle">Centre for Financial Literacy — Uttar Pradesh</div>
      <div class="loader" aria-hidden="true"></div>
      <div id="loadingText" class="loading-text">ऐप खुल रहा है…</div>
    </section>

    <iframe
      id="appFrame"
      title="CFL Daily Data Input"
      allow="camera; geolocation; microphone; clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <section id="offlinePanel" class="message-panel" hidden>
      <div class="message-card">
        <img src="./assets/icons/icon-192.png" alt="CFL" class="small-logo">
        <h2>Internet connection required</h2>
        <p>Google Sheet forms और login के लिए internet आवश्यक है। Connection आने के बाद Retry दबाएँ।</p>
        <button id="retryBtn" type="button">Retry / पुनः प्रयास</button>
      </div>
    </section>

    <section id="errorPanel" class="message-panel" hidden>
      <div class="message-card">
        <img src="./assets/icons/icon-192.png" alt="CFL" class="small-logo">
        <h2>App खोलने में समय लग रहा है</h2>
        <p>एक बार फिर प्रयास करें। जरूरत हो तो app direct भी खोल सकते हैं।</p>
        <div class="btn-row">
          <button id="reloadBtn" type="button">Retry</button>
          <button id="directBtn" class="secondary" type="button">Open Direct</button>
        </div>
      </div>
    </section>

    <button id="installBtn" class="install-fab" type="button" hidden>Install App</button>
  </main>

  <script src="./config.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
